services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: tekser_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=perpustakaan
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tekser_network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: tekser_db
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=perpustakaan
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tekser_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: tekser_nginx
    ports:
      - "2562:2562"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - tekser_network
    restart: unless-stopped

networks:
  tekser_network:
    driver: bridge

volumes:
  db_data:
    driver: local